// ===== USER ID =====
function gerarId(){
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789'
  let id = ''
  for(let i = 0; i < 8; i++){
    id += chars.charAt(Math.floor(Math.random() * chars.length))
  }
  return id
}

function getUserId(){
  let id = localStorage.getItem('user_id')
  if(!id || id.length !== 8){
    id = gerarId()
    localStorage.setItem('user_id', id)
  }
  return id
}

const userId = getUserId()

fbq('init', '1297087502402699', { external_id: userId })
fbq('track', 'PageView', { external_id: userId })

function enviarEvento(valor){
  if(!valor) return
  const nome = valor.replace(/[^a-zA-Z0-9]/g, "")
  if(!nome) return
  try { fbq('trackCustom', nome, { external_id: userId }) } catch {}
}

<meta charset="UTF-8">

<body>
<script>
(async function(){

// =========================================================
// DEBUG MODE
// =========================================================
const DEBUG = false

// =========================================================
// TOGGLE DA VARIÁVEL PARIDADE (Par/Ímpar)
// =========================================================
const params = new URLSearchParams(window.location.search)
const ENABLE_PARIDADE = (() => {
  const urlParam = params.get("paridade")
  if(urlParam !== null) return urlParam === "1"
  return true   // padrão: ligado

// GOOGLE SHEETS — URL do Apps Script
// =========================================================
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbyRp-cEQuFJpENz2zise9vxSZ8-xcF7mn4PmZvJ4_cohJYJODSZvTOLqQv9f2WOWOf6/exec"

// =========================================================
// TIMEOUT HELPER
// =========================================================
function timeout(promise, ms, fallback){
  return Promise.race([
    promise,
    new Promise(res => setTimeout(() => res(fallback), ms))
  ])
}

// =========================================================
// PARAMS
// =========================================================
let LINK = null, UC = null

const raw = params.get("dest")
if(raw && raw.includes("|||")){
  const p = raw.split("|||")
  LINK = p[0]
  UC   = p[1]
} else {
  LINK = params.get("dest")
  UC   = params.get("uc")
}

if(!LINK || !UC){
  throw new Error("Parametros invalidos")
}

// =========================================================
// PLACEMENT
// =========================================================
const plRaw  = (params.get("pl")  || "").toLowerCase().trim()
const srcRaw = (params.get("src") || "").toLowerCase().trim()

function classPlacement(p){
  if(!p || p.includes("{{")) return "PU"
  const n = p.replace(/[_\s-]/g, "")
  if(n.includes("profilereels"))  return "PP"
  if(n.includes("reelsoverlay"))  return "PV"
  if(n.includes("reels"))         return "PR"
  if(n.includes("stories"))       return "PS"
  if(n.includes("explorehome"))   return "PH"
  if(n.includes("explore"))       return "PE"
  if(n.includes("search"))        return "PQ"
  if(n.includes("marketplace"))   return "PM"
  if(n.includes("instream"))      return "PI"
  if(n.includes("video"))         return "PI"
  if(n.includes("messenger"))     return "PG"
  if(n.includes("audience"))      return "PA"
  if(n.includes("feed"))          return "PF"
  return "PO"
}

function classSrc(s){
  if(!s || s.includes("{{")) return "SU"
  if(s === "ig")  return "SI"
  if(s === "fb")  return "SF"
  if(s === "msg") return "SM"
  if(s === "an")  return "SA"
  return "SU"
}

const placementTag = classPlacement(plRaw)
const sourceTag    = classSrc(srcRaw)

// =========================================================
// DIVISÃO DA HORA (hp) – mesmo valor usado no analisador
// =========================================================

// =========================================================

// =========================================================

// =========================================================

// =========================================================
// VELOCIDADE
// =========================================================
function classificarVel(mbps){
  if(mbps <= 0.5) return 1
  if(mbps <= 1)   return 3
  if(mbps <= 5)   return 6
  if(mbps <= 10)  return 8
  if(mbps <= 20)  return 10
  return 14
}

async function medirVelocidade(){
  try {
    const downlink = navigator.connection?.downlink || 5
    return "N" + classificarVel(downlink)
  } catch { return "N6" }
}

// =========================================================
// BATERIA
// =========================================================
async function medirBateria(){
  try {
    const bat = await navigator.getBattery()
    const pct = Math.round(bat.level * 10)
    const nivel = pct < 2 ? "BL" : "B" + pct
    const carregando = bat.charging ? "C1" : "C0"
    return { bateria: nivel, carregando }
  } catch { return { bateria: "", carregando: "" } }
}

// =========================================================
// MOVIMENTO
// =========================================================
function medirMovimento(){
  return new Promise(resolve => {
    let detectado = false
    function handler(e){
      const acc = e.accelerationIncludingGravity
      if(!acc) return
      const total = Math.abs(acc.x||0) + Math.abs(acc.y||0) + Math.abs(acc.z||0)
      if(total > 15) detectado = true
    }
    if(typeof DeviceMotionEvent !== "undefined"){
      window.addEventListener("devicemotion", handler)
      setTimeout(() => {
        window.removeEventListener("devicemotion", handler)
        resolve(detectado ? "M1" : "M0")
      }, 120)
    } else {
      resolve("M0")
    }
  })
}

// =========================================================
// RAM
// =========================================================
function medirRAM(){
  const ram = navigator.deviceMemory || 4
  if(ram <= 2) return "R1"
  if(ram <= 4) return "R2"
  if(ram <= 8) return "R3"
  return "R4"
}

// =========================================================
// WEBRTC
// =========================================================
function medirWebRTC(){
  return new Promise(resolve => {
    try {
      const pc  = new RTCPeerConnection({ iceServers: [] })
      const ips = new Set()
      let encerrado = false

      function encerrar(){
        if(encerrado) return
        encerrado = true
        try { pc.close() } catch {}
        let tag = "RU"
        for(const ip of [...ips]){
          if(/^10\./.test(ip))                              { tag = "RC"; break }
          if(/^172\.(1[6-9]|2\d|3[01])\./.test(ip))         { tag = "RV"; break }
          if(/^192\.168\./.test(ip))                           tag = "RH"
        }
        resolve(tag)
      }

      pc.onicecandidate = e => {
        if(!e || !e.candidate){ encerrar(); return }
        const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/)
        if(m) ips.add(m[1])
      }

      pc.createDataChannel('')
      pc.createOffer()
        .then(o => pc.setLocalDescription(o))
        .catch(() => resolve("RU"))

      setTimeout(() => encerrar(), 850)

    } catch { resolve("RU") }
  })
}

// =========================================================
// FBC e FBP — cookies do Meta
// =========================================================
function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'))
  return match ? match[2] : ""
}

// =========================================================
// OUTROS SINCRONOS
// =========================================================
const tema    = window.matchMedia('(prefers-color-scheme: dark)').matches ? "D" : "L"
const ua      = navigator.userAgent || ""
const device  = /android/i.test(ua) ? "A" : /iphone|ipad|ipod/i.test(ua) ? "I" : "O"
const vib     = navigator.vibrate ? "V1" : "V0"
const conexao = (() => {
  const c = navigator.connection
  if(!c)                    return "U"
  if(c.type === "wifi")     return "W"
  if(c.type === "cellular") return "M"
  return "U"
})()

// =========================================================
// EXECUCAO PARALELA
// =========================================================
const [velTag, batObj, movimento, redeTag] = await Promise.all([
  timeout(medirVelocidade(), 200, "N6"),
  timeout(medirBateria(),    200, { bateria: "", carregando: "" }),
  timeout(medirMovimento(),  200, "M0"),
  timeout(medirWebRTC(),     950, "RU")
])

const ram = medirRAM()

// =========================================================
// PARIDADE (calculada a partir do minuto atual)
// =========================================================
let paridadeTag = null
if(ENABLE_PARIDADE){
  const agora = new Date()
  const minuto = agora.getMinutes()
  paridadeTag = minuto % 2 === 0 ? "Par" : "Ímpar"
}

// =========================================================
// NOVAS VARIÁVEIS (requeridas pelo analisador)
// =========================================================
const agoraData = new Date()
const hora = agoraData.getHours()
const minuto = agoraData.getMinutes()
const segundo = agoraData.getSeconds()
const dia = agoraData.getDate()
const diaSemana = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][agoraData.getDay()]

// Min_Dezena (dezena do minuto: 0-5 → par/ímpar)
const dezena = Math.floor(minuto / 10)
const minDezena = dezena % 2 === 0 ? "Par" : "Ímpar"

// Min_Unidade (unidade do minuto)
const unidade = minuto % 10
const minUnidade = unidade % 2 === 0 ? "Par" : "Ímpar"

// Seg_Metade (primeira ou segunda metade do minuto)
const segMetade = segundo <= 30 ? "Seg_00_30" : "Seg_31_60"

// Hora_Par (hora par ou ímpar)
const horaPar = hora % 2 === 0 ? "Par" : "Ímpar"

// Dia_Par (dia do mês par ou ímpar)
const diaPar = dia % 2 === 0 ? "Par" : "Ímpar"

// Periodo (Manhã, Tarde, Noite)
let periodo = "Noite"
if (hora >= 6 && hora <= 11) periodo = "Manhã"
else if (hora >= 12 && hora <= 17) periodo = "Tarde"

// B_Par (paridade do número da bateria)
const bNum = parseInt((batObj.bateria.match(/\d+/) || [0])[0])
const bPar = isNaN(bNum) ? null : (bNum % 2 === 0 ? "Par" : "Ímpar")

// N_Par (paridade do número da velocidade)
const nNum = parseInt((velTag.match(/\d+/) || [0])[0])
const nPar = isNaN(nNum) ? null : (nNum % 2 === 0 ? "Par" : "Ímpar")

// FBP e FBC (1 se cookie presente, 0 caso contrário)
const fbpCookie = getCookie("_fbp")
const fbcCookie = getCookie("_fbc")
const FBP = (fbpCookie && fbpCookie !== "") ? 1 : 0
const FBC = (fbcCookie && fbcCookie !== "") ? 1 : 0

// =========================================================
// DEBUG
// =========================================================
if(DEBUG){
  alert(
    "=== DEBUG UC ===\n" +
    "pl bruto:     [" + plRaw         + "]\n" +
    "src bruto:    [" + srcRaw        + "]\n" +
    "placementTag: [" + placementTag  + "]\n" +
    "sourceTag:    [" + sourceTag     + "]\n" +
    "redeTag:      [" + redeTag       + "]\n" +
    "velTag:       [" + velTag        + "]\n" +
    "bateria:      [" + batObj.bateria + batObj.carregando + "]\n" +
    "device:       [" + device        + "]\n" +
    "conexao:      [" + conexao       + "]\n" +
    "movimento:    [" + movimento     + "]\n" +
    (ENABLE_PARIDADE ? "paridade:     [" + paridadeTag + "]\n" : "paridade:     [desativada]\n") +
    "Min_Dezena:   [" + minDezena     + "]\n" +
    "Min_Unidade:  [" + minUnidade    + "]\n" +
    "Seg_Metade:   [" + segMetade     + "]\n" +
    "Hora_Par:     [" + horaPar       + "]\n" +
    "DiaSemana:    [" + diaSemana     + "]\n" +
    "Dia_Par:      [" + diaPar        + "]\n" +
    "Periodo:      [" + periodo       + "]\n" +
    "B_Par:        [" + bPar          + "]\n" +
    "N_Par:        [" + nPar          + "]\n" +
    "FBP:          [" + FBP           + "]\n" +
    "FBC:          [" + FBC           + "]\n" +
    "userId:       [" + userId        + "]"
  )
}

// =========================================================
// EVENTOS META — sinais individuais
// =========================================================
const eventosBasicos = [
  tempoTag,
  velTag,
  batObj.bateria,
  batObj.carregando,
  tema,
  ram,
  vib,
  device,
  conexao,
  movimento,
  redeTag,
  placementTag,
  sourceTag,
  minDezena,
  minUnidade,
  segMetade,
  horaPar,
  diaSemana,
  diaPar,
  periodo,
  (bPar !== null ? bPar : ""),
  (nPar !== null ? nPar : ""),
  "FBP" + FBP,
  "FBC" + FBC
]
if(ENABLE_PARIDADE && paridadeTag) eventosBasicos.push(paridadeTag)

eventosBasicos.forEach(enviarEvento)

// =========================================================
// HORA DO CLIQUE — granularidade configurável via parâmetro hp
// =========================================================
let horaTag;
if (hp === 1) {
  horaTag = "H" + String(hora).padStart(2, "0");
} else {
  const bucket = Math.min(Math.floor(minuto * hp / 60), hp - 1);
  horaTag = "H" + String(hora).padStart(2, "0") + "M" + bucket;
}
enviarEvento(horaTag);

// =========================================================
// BROWSER TAG — EX (navegador externo) ou IX (Instagram interno)
// =========================================================
const browserTag = /EX(?=ID)/i.test(UC) ? "EX" : /IX(?=ID)/i.test(UC) ? "IX" : "Outros"

// =========================================================
// MAPA DE RUNTIME — todas as variáveis disponíveis para as regras
// =========================================================
const RUNTIME = {
  T         : tempoTag,
  N         : velTag,
  B         : batObj.bateria    || "B_absent",
  C         : batObj.carregando || "C_absent",
  Tema      : tema,
  RAM       : ram,
  V         : vib,
  Device    : device,
  Conexao   : conexao,
  Movimento : movimento,
  Rede      : redeTag,
  Placement : placementTag,
  Source    : sourceTag,
  Browser   : browserTag,
  Hora      : horaTag,
  // Novas variáveis:
  Min_Dezena   : minDezena,
  Min_Unidade  : minUnidade,
  Seg_Metade   : segMetade,
  Hora_Par     : horaPar,
  DiaSemana    : diaSemana,
  Dia_Par      : diaPar,
  Periodo      : periodo,
  B_Par        : bPar,
  N_Par        : nPar,
  FBP          : FBP,
  FBC          : FBC
}
if(ENABLE_PARIDADE && paridadeTag) RUNTIME.Paridade = paridadeTag

// =========================================================
// EVENTOS PERSONALIZADOS — TOP RANKING
// =========================================================

// ─────────────────────────────────────────────────
// TOP02 — 1 variável (cole as regras geradas pelo analisador)
// ─────────────────────────────────────────────────
const REGRAS_TOP02 = [
  // Exemplo: { Browser: "EX" },
]

// ─────────────────────────────────────────────────
// TOP03 — 2 variáveis
// ─────────────────────────────────────────────────
const REGRAS_TOP03 = [
  // Exemplo: { N: "N8", B: "B4" },
]

// ─────────────────────────────────────────────────
// TOP04 — 3 variáveis
// ─────────────────────────────────────────────────
const REGRAS_TOP04 = [
 

  { Hora: "H04M1", Min_Dezena: "Ímpar" },
  { N: "N6", Hora: "H08M1" },
  { C: "C1", Hora: "H11M0" },
  { Source: "SI", Hora: "H01M0" },
  { B: "B8", Hora: "H08M1" },

  { Conexao: "M", DiaSemana: "Sábado" },
  { N: "N6", Hora: "H11M0" },

  { Hora: "H21M0", DiaSemana: "Segunda" },
  { B: "B_absent", Hora: "H11M1" },
  { Hora: "H13M0", DiaSemana: "Terça" },
  { Hora: "H16M1", DiaSemana: "Terça" },



]

// ─────────────────────────────────────────────────
// TOP05 — 4 variáveis
// ─────────────────────────────────────────────────
const REGRAS_TOP05 = []

// ─────────────────────────────────────────────────
// TOP06 — 5 variáveis
// ─────────────────────────────────────────────────
const REGRAS_TOP06 = []

// ─────────────────────────────────────────────────
// Função de match
// ─────────────────────────────────────────────────
const matchTop = (regras) => regras.some(regra =>
  Object.entries(regra).every(([p, v]) => RUNTIME[p] === v)
)

const bateuTop02 = matchTop(REGRAS_TOP02)
const bateuTop03 = matchTop(REGRAS_TOP03)
const bateuTop04 = matchTop(REGRAS_TOP04)
const bateuTop05 = matchTop(REGRAS_TOP05)
const bateuTop06 = matchTop(REGRAS_TOP06)

if (bateuTop02) enviarEvento("TOP02")
if (bateuTop03) enviarEvento("TOP03")
if (bateuTop04) enviarEvento("TOP04")
if (bateuTop05) enviarEvento("TOP05")
if (bateuTop06) enviarEvento("TOP06")

// Tag resumida para o UC — pega o maior nível que bateu
const topTag = bateuTop06 ? "F6"
             : bateuTop05 ? "F5"
             : bateuTop04 ? "F4"
             : bateuTop03 ? "F3"
             : bateuTop02 ? "F2"
             : ""

// =========================================================
// MONTAGEM DO UC FINAL
// =========================================================
const idTag = "ID" + userId  // sempre 8+2 = 10 chars

const corpoParts = [
  baseUC,
  tempoTag,
  velTag,
  batObj.bateria,
  batObj.carregando,
  tema,
  ram,
  vib,
  device,
  conexao,
  movimento,
  redeTag,
  placementTag,
  sourceTag
]

const corpo = corpoParts.join("").replace(/[^a-zA-Z0-9]/g, "")

const MAX          = 48
const espacoCorpo  = MAX - idTag.length - topTag.length
const corpoFinal   = corpo.slice(0, espacoCorpo)
const finalUC      = corpoFinal + topTag + idTag

// =========================================================
// SALVAR NO GOOGLE SHEETS (fire-and-forget)
// =========================================================
try {
  const fbc = getCookie("_fbc") || params.get("fbclid") || ""
  const fbp = getCookie("_fbp") || ""

  const agora = new Date()
  const data_hora = agora.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" })

  const payload = {
    data_hora,
    external_id : userId,
    fbc,
    fbp,
    placement   : placementTag,
    source      : sourceTag,
    device,
    conexao,
    rede        : redeTag,
    velocidade  : velTag,
    uc_completo : finalUC,
    // também envia as novas variáveis para debug
    min_dezena  : minDezena,
    min_unidade : minUnidade,
    seg_metade  : segMetade,
    hora_par    : horaPar,
    dia_semana  : diaSemana,
    dia_par     : diaPar,
    periodo     : periodo,
    b_par       : bPar,
    n_par       : nPar,
    fbp_flag    : FBP,
    fbc_flag    : FBC
  }
  if(ENABLE_PARIDADE && paridadeTag) payload.paridade = paridadeTag

  fetch(SHEETS_URL, {
    method  : "POST",
    mode    : "no-cors",
    headers : { "Content-Type": "application/json" },
    body    : JSON.stringify(payload)
  }).catch(() => {})

} catch(e) {}

// =========================================================
// REDIRECT
// =========================================================
const url = `https://shopee-utm-tracker.onrender.com/?link=${encodeURIComponent(LINK)}&uc=${finalUC}`

setTimeout(() => {
  window.location.href = url
}, 400)

})();
</script>
